[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-refeed"
version = "0.1.0"
description = "Django app that aggregates RSS, Atom, and LiveWhale event feeds and republishes tagged entries as RSS, Atom, and JSON feeds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
	"Django>=4.2",
	"feedparser>=6.0",
]
classifiers = [
	"Framework :: Django",
	"Framework :: Django :: 4.2",
	"Framework :: Django :: 5.2",
	"Framework :: Wagtail",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
]

[project.optional-dependencies]
wagtail = ["wagtail>=6.3"]
test = [
	"pytest>=8",
	"pytest-django>=4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refeed"]

[tool.hatch.build.targets.sdist]
include = ["src/refeed", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/refeed/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["refeed"]
